<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>项目树</title>
<style>
  /* ===========================================================
     苹果审美 (Apple-like): Clarity / Deference / Depth
     - 浅色为主, 系统自动跟随暗色
     - Squircle 18px 大圆角 + 多层柔阴影 (不靠 1px 边框)
     - Liquid Glass: 半透明 + backdrop-filter (玻璃感)
     - SF 字体栈, tabular-nums, cursor:default, user-select:none
     - 大留白, 控件按需透明度淡入
     =========================================================== */
  :root{
    --bg:           #f5f5f7;
    --bg-canvas:    #e9e9ec;
    --input-bg:     #ffffff;
    --card:         rgba(255,255,255,.78);
    --card-solid:   #ffffff;
    --card-deeper:  #fbfbfd;
    --text:         #1d1d1f;
    --muted:        #6e6e73;
    --muted-2:      #86868b;
    --line:         rgba(0,0,0,.06);
    --accent:       #0071e3;
    --accent-pressed:#0058b0;
    --green:        #2f9e44;
    --red:          #e8392f;
    --orange:       #e8830c;
    --radius:       18px;
    --radius-sm:    12px;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.04);
    --shadow:       0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.04);
    --shadow-lg:    0 4px 12px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.12);
    --topbar-h:     58px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:           #000;
      --bg-canvas:    #000;
      --input-bg:     #2c2c2e;
      --card:         rgba(28,28,30,.78);
      --card-solid:   #1c1c1e;
      --card-deeper:  #2c2c2e;
      --text:         #f5f5f7;
      --muted:        #a1a1a6;
      --muted-2:      #8e8e93;
      --line:         rgba(255,255,255,.1);
      --shadow-sm:    0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.4);
      --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.5), 0 24px 48px rgba(0,0,0,.45);
      --shadow-lg:    0 4px 12px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg-canvas);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-variant-numeric:tabular-nums;
    cursor:default;
    user-select:none;
    -webkit-user-select:none;
  }
  /* 顶部条 (Liquid Glass) */
  .topbar{
    position:sticky; top:0; z-index:50;
    height:var(--topbar-h);
    display:flex; align-items:center; gap:10px;
    padding:0 18px;
    background:var(--card);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    box-shadow:0 1px 0 var(--line);
  }
  .logo{
    font-size:15px; font-weight:600; letter-spacing:.2px;
    color:var(--text);
    margin-right:4px;
    white-space:nowrap;
  }
  .logo .ti{
    color:var(--accent);
    font-weight:700;
    margin-right:4px;
  }
  .top-sp{flex:1;}
  /* 顶部按钮 / 选择器 */
  .tb-btn{
    background:transparent;
    color:var(--text);
    border:0;
    border-radius:10px;
    padding:7px 11px;
    font-size:13px; font-weight:500;
    cursor:default;
    line-height:1;
    transition:background .12s;
  }
  .tb-btn:hover{ background:rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark){ .tb-btn:hover{ background:rgba(255,255,255,.08); } }
  .tb-btn:active{ background:rgba(0,0,0,.09); transform:none; }
  .tb-btn.primary{ background:var(--accent); color:#fff; }
  .tb-btn.primary:hover{ background:#0084ff; }
  .tb-btn.primary:active{ background:var(--accent-pressed); }
  .tb-btn.danger:hover{ background:rgba(232,57,47,.08); color:var(--red); }
  .tb-sep{ width:1px; height:22px; background:var(--line); margin:0 4px; }
  select.proj-sel{
    appearance:none; -webkit-appearance:none;
    background:rgba(0,0,0,.04);
    color:var(--text);
    border:0;
    border-radius:10px;
    padding:7px 28px 7px 12px;
    font-size:13px; font-weight:600;
    cursor:default;
    background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%236e6e73'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 10px center;
    max-width:260px;
  }
  @media (prefers-color-scheme: dark){ select.proj-sel{ background-color:rgba(255,255,255,.08); } }
  /* 语言切换段控件 (Apple segmented control 风) */
  .lang{
    display:inline-flex; gap:0;
    background:rgba(0,0,0,.04);
    padding:2px;
    border-radius:9px;
    margin-left:6px;
  }
  @media (prefers-color-scheme: dark){ .lang{ background:rgba(255,255,255,.08); } }
  .lang span{
    font-size:11px; font-weight:500;
    color:var(--muted);
    padding:4px 9px;
    border-radius:7px;
    line-height:1.2;
    transition:background .12s, color .12s;
  }
  .lang span.on{ background:var(--card-solid); color:var(--text); box-shadow:var(--shadow-sm); }
  /* 主体 */
  main{
    max-width:980px;
    margin:0 auto;
    padding:26px 18px 80px;
  }
  /* 空项目提示 */
  .emptytip{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    padding:80px 16px 60px;
    line-height:1.7;
  }
  .emptytip .em-add{
    display:inline-block;
    margin-top:14px;
  }
  /* 节点卡片 */
  .node{
    background:var(--card-solid);
    border-radius:var(--radius);
    margin:0 0 12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:box-shadow .15s;
  }
  .node .node{
    margin:8px 0 0;
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);
    background:var(--card-deeper);
  }
  .node .node .node{
    background:var(--bg);
    box-shadow:none;
    border:1px solid var(--line);
  }
  .node-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px;
    cursor:default;
    flex-wrap:wrap;
    min-height:54px;
  }
  .node .node .node-head{ padding:11px 14px; min-height:46px; }
  .node .node .node .node-head{ padding:9px 12px; min-height:40px; }
  .node-tog{
    width:14px; height:14px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted-2);
    font-size:9px;
    transition:transform .18s;
    flex:0 0 auto;
    cursor:default;
  }
  .node:not(.collapsed)>.node-head .node-tog{ transform:rotate(90deg); }
  .node-tog.empty{ visibility:hidden; }
  .node-name{
    font-size:16px; font-weight:600;
    color:var(--text);
    line-height:1.3;
  }
  .node-name .ph{ color:var(--muted); font-weight:400; font-style:italic; }
  .node .node .node-name{ font-size:14px; font-weight:600; }
  .node .node .node .node-name{ font-size:13px; font-weight:500; }
  .node-meta{
    font-size:12px;
    color:var(--muted);
    display:inline-flex; align-items:center; gap:4px;
  }
  .node-meta .sep{ color:var(--line); }
  .node-people{
    font-size:11px;
    color:var(--accent);
    background:rgba(0,113,227,.08);
    padding:2px 8px;
    border-radius:8px;
    white-space:nowrap;
  }
  .node-badge{
    font-size:11px; font-weight:500;
    padding:2px 8px;
    border-radius:8px;
    white-space:nowrap;
    display:inline-flex; align-items:center; gap:4px;
  }
  .b-have   { color:var(--green); background:rgba(47,158,68,.1); }
  .b-partial{ color:var(--orange);background:rgba(232,131,12,.1);}
  .b-gap    { color:var(--red);   background:rgba(232,57,47,.1); }
  .node-cnt{
    font-size:11px;
    color:var(--muted-2);
    background:rgba(0,0,0,.04);
    padding:1px 8px;
    border-radius:8px;
  }
  @media (prefers-color-scheme: dark){ .node-cnt{ background:rgba(255,255,255,.08); } }
  .node-sub{
    font-size:12px;
    color:var(--muted);
    width:100%;
    padding-left:24px;
    line-height:1.5;
    margin-top:-4px;
  }
  /* ---- v0.2: 节点批注 ---- */
  .node-notes{
    font-size:12px;
    color:var(--muted-2);
    width:100%;
    padding:4px 6px 2px 26px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    border-left:2px solid var(--line);
    margin-top:3px;
  }
  .node .node .node-notes{ padding-left:20px; }
  /* 节点控件 (hover 才显, 苹果克制感) */
  .node-ctrls{
    margin-left:auto;
    display:inline-flex; gap:2px;
    opacity:0;
    transition:opacity .15s;
  }
  .node-head:hover .node-ctrls{ opacity:1; }
  .node-ctrl{
    width:30px; height:30px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:8px;
    font-size:14px;
    color:var(--muted);
    transition:background .12s, color .12s;
    cursor:default;
  }
  .node-ctrl:hover{ background:rgba(0,0,0,.06); color:var(--text); }
  @media (prefers-color-scheme: dark){ .node-ctrl:hover{ background:rgba(255,255,255,.1); } }
  .node-ctrl.add:hover{ background:rgba(0,113,227,.12); color:var(--accent); }
  .node-ctrl.del:hover{ background:rgba(232,57,47,.12); color:var(--red); }
  .node-ctrl:active{ background:rgba(0,0,0,.12); }
  /* 节点 body (折叠时隐藏) */
  .node-body{
    padding:0 18px 14px 32px;
  }
  .node .node .node-body{ padding:0 14px 10px 26px; }
  .node .node .node .node-body{ padding:0 12px 8px 22px; }
  .node.collapsed>.node-body{ display:none; }
  .node-kids{ }
  /* 加根节点 */
  .add-root{
    margin-top:14px; text-align:center;
  }
  .add-root .tb-btn{
    background:var(--card-solid);
    box-shadow:var(--shadow-sm);
    padding:10px 18px;
    font-size:13px;
    color:var(--accent);
  }
  .add-root .tb-btn:hover{ background:var(--card-deeper); }
  /* 弹窗 */
  .modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal.open{ display:flex; }
  .modal-box{
    background:var(--card-solid);
    border-radius:18px;
    box-shadow:var(--shadow-lg);
    max-width:480px; width:100%;
    padding:24px 26px 20px;
    user-select:none;
    max-height:90vh;
    overflow-y:auto;
  }
  .modal-title{
    font-size:18px; font-weight:600;
    margin:0 0 4px;
    color:var(--text);
  }
  .modal-hint{
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .field{ margin-bottom:13px; }
  .field label{
    display:block;
    font-size:11px; font-weight:500;
    color:var(--muted);
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .field input, .field select{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
    outline:none;
    font-family:inherit;
    user-select:text;
    -webkit-user-select:text;
    transition:border-color .12s, box-shadow .12s;
  }
  .field input:focus, .field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,113,227,.15);
  }
  /* ---- v0.2: textarea ---- */
  .field textarea{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
    outline:none;
    font-family:inherit;
    user-select:text;
    -webkit-user-select:text;
    transition:border-color .12s, box-shadow .12s;
    resize:vertical;
    min-height:68px;
    line-height:1.5;
  }
  .field textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,113,227,.15);
  }
  /* ---- v0.2: 模板选择器 ---- */
  .tmpl-picker{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-top:2px;
  }
  .tmpl-opt{
    padding:6px 12px;
    border-radius:9px;
    font-size:12px; font-weight:500;
    color:var(--muted);
    background:rgba(0,0,0,.04);
    border:1.5px solid transparent;
    cursor:default;
    transition:background .12s, color .12s, border-color .12s;
    line-height:1;
  }
  @media (prefers-color-scheme: dark){ .tmpl-opt{ background:rgba(255,255,255,.06); } }
  .tmpl-opt:hover{ background:rgba(0,0,0,.07); color:var(--text); }
  @media (prefers-color-scheme: dark){ .tmpl-opt:hover{ background:rgba(255,255,255,.1); } }
  .tmpl-opt.sel{ background:rgba(0,113,227,.1); color:var(--accent); border-color:rgba(0,113,227,.3); }
  /* 模板徽章 (topbar 里显示) */
  .tmpl-chip{
    font-size:10px; font-weight:500;
    color:var(--accent);
    background:rgba(0,113,227,.08);
    padding:2px 7px;
    border-radius:6px;
    white-space:nowrap;
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-btns{
    display:flex; justify-content:flex-end; gap:8px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .modal-btn{
    border:0; border-radius:10px;
    padding:9px 18px;
    font-size:13px; font-weight:500;
    cursor:default;
    font-family:inherit;
    transition:background .12s;
  }
  .mb-cancel{ background:rgba(0,0,0,.05); color:var(--text); }
  .mb-cancel:hover{ background:rgba(0,0,0,.09); }
  .mb-save{ background:var(--accent); color:#fff; }
  .mb-save:hover{ background:#0084ff; }
  .mb-save:active{ background:var(--accent-pressed); }
  @media (prefers-color-scheme: dark){
    .mb-cancel{ background:rgba(255,255,255,.08); }
    .mb-cancel:hover{ background:rgba(255,255,255,.14); }
  }
  /* 状态条 */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--card-solid);
    color:var(--text);
    padding:10px 18px;
    border-radius:12px;
    font-size:13px;
    box-shadow:var(--shadow-lg);
    z-index:200;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  input[type="file"]{ display:none; }
  body.embed .logo{ display:none; }
  body.embed .topbar{ height:48px; padding:0 12px; }
  body.embed main{ padding:14px 12px 60px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.18); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(0,0,0,.3); }
  @media (prefers-color-scheme: dark){
    ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); }
    ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.3); }
  }
  @media (max-width: 640px){
    .topbar{ flex-wrap:wrap; height:auto; padding:8px 12px; gap:6px; }
    .top-sp{ display:none; }
    .tb-btn{ padding:6px 9px; font-size:12px; }
    select.proj-sel{ font-size:12px; max-width:160px; }
    main{ padding:14px 10px 60px; }
    .node-head{ padding:12px 14px; }
  }
  /* ---- v0.3: cloud UI ---- */
  .sync-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--green); flex:0 0 auto;
    transition:background .3s;
  }
  .sync-dot.syncing{ background:var(--orange); animation:sync-pulse .9s infinite; }
  .sync-dot.error{ background:var(--red); }
  @keyframes sync-pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .cloud-btn{
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:6px 13px; font-size:12px; font-weight:600;
    cursor:default; white-space:nowrap; line-height:1;
    transition:background .12s;
  }
  .cloud-btn:hover{ background:#0084ff; }
  .cloud-btn:active{ background:var(--accent-pressed); }
  .cloud-btn.signed-in{
    background:rgba(0,113,227,.1); color:var(--accent); font-weight:500;
  }
  .cloud-btn.signed-in:hover{ background:rgba(0,113,227,.16); }
  .auth-box{ text-align:center; padding:8px 0 4px; }
  .auth-logo{ font-size:40px; margin-bottom:12px; }
  .auth-title{ font-size:20px; font-weight:600; margin-bottom:6px; }
  .auth-sub{ font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.5; }
  .auth-email-input{
    width:100%; padding:11px 14px; box-sizing:border-box;
    background:var(--input-bg); border:1.5px solid var(--line);
    border-radius:12px; font-size:14px; color:var(--text);
    transition:border-color .12s, box-shadow .12s; outline:none;
    margin-bottom:10px;
  }
  .auth-email-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,113,227,.12); }
  .auth-email-btn{
    display:block; width:100%; padding:12px 16px;
    background:var(--accent); border:none;
    border-radius:12px; font-size:14px; font-weight:600;
    color:#fff; cursor:default;
    transition:opacity .12s;
  }
  .auth-email-btn:hover{ opacity:.9; }
  .auth-email-btn:disabled{ opacity:.45; cursor:default; }
  .auth-email-sent{
    margin-top:12px; font-size:13px; color:#2f9e44; display:none;
  }
  .auth-offline-link{
    display:block; margin-top:14px;
    font-size:12px; color:var(--muted); cursor:default;
  }
  .auth-offline-link:hover{ color:var(--text); }
  .invite-link-row{
    display:flex; gap:8px; align-items:center; margin-top:8px;
  }
  .invite-link-input{
    flex:1; font-size:12px; color:var(--muted);
    background:var(--input-bg); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px;
    user-select:text; -webkit-user-select:text; outline:none;
  }
  .invite-copy-btn{
    flex:0 0 auto; padding:8px 12px;
    background:var(--accent); color:#fff; border:0;
    border-radius:8px; font-size:12px; font-weight:500; cursor:default;
  }
  .invite-copy-btn:hover{ background:#0084ff; }
  .member-list{ margin-top:16px; }
  .member-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 0; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .member-row:last-child{ border-bottom:none; }
  .member-avatar{
    width:28px; height:28px; border-radius:50%;
    background:rgba(0,113,227,.1);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; color:var(--accent); flex:0 0 auto;
  }
  .member-role{
    font-size:11px; color:var(--muted);
    background:rgba(0,0,0,.04); border-radius:6px; padding:1px 6px;
  }
  @media (prefers-color-scheme:dark){ .member-role{ background:rgba(255,255,255,.08); } }

  /* ── 搜索栏 ── */
  #searchBar{
    position:sticky; top:var(--topbar-h); z-index:49;
    height:44px; padding:0 18px;
    display:none; align-items:center; gap:10px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 1px 0 var(--line);
  }
  #searchBar.open{ display:flex; }
  @media(prefers-color-scheme:dark){
    #searchBar{ background:rgba(28,28,30,.82); }
  }
  .search-wrap{ position:relative; display:flex; align-items:center; }
  .search-input{
    width:280px; height:28px; padding:4px 24px 4px 30px;
    background:var(--input-bg); border:none; border-radius:8px;
    font-size:13px; color:var(--text); outline:none; font-family:inherit;
  }

  .node:focus{ outline:none; }

  @media(prefers-color-scheme:dark){

/* state = { projects: [project], currentId }
   project = { id, name, template?, owner?, created_at, updated_at, sort_order, nodes:[node] }
   node = { id, parent_id|null, name, director|null, subtitle|null, sort_order,

   owner/by/updated_at 预埋给 v0.3 云协作, 现在写但不读. */
const STORE_KEY = 'projtree-v1';
const state = { projects:[], currentId:null };

function uuid(){ try{ return crypto.randomUUID(); }catch(_){ return 't_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); } }
function now(){ return new Date().toISOString(); }

function loadFromStorage(){
  let raw=null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(_){}
  let d = {};
  if(raw){ try{ d = JSON.parse(raw)||{}; }catch(_){ d={}; } }
  state.projects = Array.isArray(d.projects) ? d.projects : [];
  state.currentId = d.currentId || null;
  if(!state.projects.length){
    const p = { id:uuid(), name:t('proj_first'), template:'default', owner:null, created_at:now(), updated_at:now(), sort_order:0, nodes:[] };
    state.projects.push(p);
    state.currentId = p.id;
    saveToStorage();
  }
  if(!state.currentId || !state.projects.find(p=>p.id===state.currentId)){
    state.currentId = state.projects[0].id;
    saveToStorage();
  }
  const urlPid = new URLSearchParams(location.search).get('project');
  if(urlPid && state.projects.find(p=>p.id===urlPid)){ state.currentId = urlPid; }
}
function saveToStorage(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({projects:state.projects, currentId:state.currentId}));
  }catch(e){
    // QuotaExceededError：本地存满了，数据仍在内存，云端登录状态下会同步
    if(e && e.name==='QuotaExceededError'){
      console.warn('[projtree] localStorage quota exceeded — data lives in memory & cloud only');
      toast('⚠️ 本地存储已满，数据仅保存在云端（请登录）');
    }
  }
  schedulePush();
}
function saveToLocalOnly(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({projects:state.projects, currentId:state.currentId})); }catch(_){}
}
function curProj(){ return state.projects.find(p=>p.id===state.currentId); }
function curNodes(){ const p=curProj(); return p?p.nodes:[]; }

/* ---------------- 树辅助 ---------------- */
function childrenMap(nodes){
  const m={};
  nodes.forEach(n=>{ const k=n.parent_id||'__root__'; (m[k]=m[k]||[]).push(n); });
  for(const k in m) m[k].sort((a,b)=>(a.sort_order-b.sort_order) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
  return m;
}
function depthMap(nodes){
  const cm=childrenMap(nodes); const d={};
  (function walk(list,dep){ list.forEach(n=>{ d[n.id]=dep; walk(cm[n.id]||[],dep+1); }); })(cm['__root__']||[],0);
  return d;
}
function subtreeIds(nodes, rootId){
  const cm=childrenMap(nodes); const out=[];
  (function walk(id){ out.push(id); (cm[id]||[]).forEach(c=>walk(c.id)); })(rootId);
  return out;
}

/* ---------------- UI 状态 (折叠) ---------------- */
const ui = { collapsed:new Set(), collapseInit:false, searchQ:'', focusId:null };
function initCollapse(){
  ui.collapsed = new Set();
  const nodes = curNodes();
  const cm = childrenMap(nodes);
  const dm = depthMap(nodes);
  nodes.forEach(n=>{ if((dm[n.id]||0)>=1 && (cm[n.id]||[]).length) ui.collapsed.add(n.id); });
  ui.collapseInit = true;
}

/* ---------------- 渲染 ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 搜索高亮：把 str 中所有 q 片段用 <mark class="hl"> 包裹 */
function hlText(str, q){
  if(!q || !str) return esc(str||'');
  const s = String(str), lower = s.toLowerCase(), lq = q.toLowerCase();
  const parts = []; let i = 0;
  while(i < s.length){
    const pos = lower.indexOf(lq, i);
    if(pos < 0){ parts.push(esc(s.slice(i))); break; }
    if(pos > i) parts.push(esc(s.slice(i, pos)));
    parts.push(`<mark class="hl">${esc(s.slice(pos, pos+lq.length))}</mark>`);
    i = pos + lq.length;
  }
  return parts.join('');
}
/* 返回匹配节点 + 所有祖先的 id 集合，query 为空则返回 null */
function buildMatchSet(nodes, query){
  if(!query) return null;
  const q = query.toLowerCase();
  const byId = {}; nodes.forEach(n=>{ byId[n.id]=n; });
  const set = new Set();
  nodes.forEach(n=>{
    const hit = (n.name||'').toLowerCase().includes(q) ||
                (n.director||'').toLowerCase().includes(q) ||
                (n.subtitle||'').toLowerCase().includes(q);
    if(hit){
      set.add(n.id);
      let cur = n;
      while(cur.parent_id && byId[cur.parent_id]){ set.add(cur.parent_id); cur = byId[cur.parent_id]; }
    }
  });
  return set;
}
function badgeHtml(b){
  if(!b) return '';
  /* v0.2: 用 tpl() 读模板覆盖的状态标签 */
  const lab = ({have:tpl('b_have'), partial:tpl('b_partial'), gap:tpl('b_gap')})[b] || '';
  return `<span class="node-badge b-${esc(b)}">${esc(lab)}</span>`;
}
function nodeCtrlsHtml(node){
  return `<span class="node-ctrls">
    <span class="node-ctrl" role="button" tabindex="-1" data-act="edit" data-id="${esc(node.id)}" aria-label="${esc(t('edit'))}" title="${esc(t('edit'))}">✏️</span>
    <span class="node-ctrl add" role="button" tabindex="-1" data-act="addchild" data-id="${esc(node.id)}" aria-label="${esc(t('add_child'))}" title="${esc(t('add_child'))}">＋</span>
    <span class="node-ctrl del" role="button" tabindex="-1" data-act="del" data-id="${esc(node.id)}" aria-label="${esc(t('del_node'))}" title="${esc(t('del_node'))}">🗑</span>
  </span>`;
}
/* 拼装屏幕阅读器朗读的节点标签：名称 + 负责人 + 状态 */
function ariaLabelFor(node){
  const meta = node.meta||{};
  const parts = [node.name || t('unnamed')];
  if(node.director) parts.push(tpl('f_director')+': '+node.director);
  const b = meta.badge;
  if(b) parts.push(({have:tpl('b_have'), partial:tpl('b_partial'), gap:tpl('b_gap')})[b]||'');
  /* 副标题与批注也拼进朗读标签，否则 treeitem 的 aria-label 会盖住它们 */
  if(node.subtitle) parts.push(node.subtitle);
  if(meta.notes) parts.push(meta.notes);
  return parts.filter(Boolean).join(', ');
}
function renderNode(node, cm, matchIds, level){
  if(matchIds && !matchIds.has(node.id)) return '';
  const kids = cm[node.id]||[];
  const meta = node.meta||{};
  /* 搜索时自动展开所有祖先，避免命中节点被折叠藏起来 */
  const collapsed = matchIds ? false : ui.collapsed.has(node.id);
  const togCls = kids.length ? '' : ' empty';
  const cnt = kids.length ? `<span class="node-cnt">${kids.length}</span>` : '';
  const q = ui.searchQ;
  const dir = node.director ? `<span class="node-meta">${hlText(node.director,q)}</span>` : '';
  const ppl = meta.people ? `<span class="node-people">${esc(meta.people)}</span>` : '';
  const bdg = badgeHtml(meta.badge);
  const sep1 = (dir && (ppl||bdg)) ? `<span class="node-meta sep">·</span>` : '';
  const sep2 = (ppl && bdg) ? `<span class="node-meta sep">·</span>` : '';
  const sub = node.subtitle ? `<div class="node-sub">${hlText(node.subtitle,q)}</div>` : '';
  /* v0.2: 批注 */
  const notes = meta.notes ? `<div class="node-notes">${esc(meta.notes)}</div>` : '';
  const nameHtml = node.name ? hlText(node.name,q) : `<span class="ph">${esc(t('unnamed'))}</span>`;
  /* a11y: WAI-ARIA tree 模式 */
  const lvl = level||1;
  const ariaExp = kids.length ? ` aria-expanded="${collapsed?'false':'true'}"` : '';
  const tab = (ui.focusId===node.id) ? '0' : '-1';
  return `<div class="node${collapsed?' collapsed':''}" data-node="${esc(node.id)}" role="treeitem" aria-level="${lvl}"${ariaExp} tabindex="${tab}" aria-label="${esc(ariaLabelFor(node))}">
    <div class="node-head" data-nodehead="${esc(node.id)}">
      <span class="node-tog${togCls}" aria-hidden="true">▶</span>
      <span class="node-name">${nameHtml}</span>
      ${dir}${sep1}${ppl}${sep2}${bdg}${cnt}
      ${nodeCtrlsHtml(node)}
      ${sub}${notes}
    </div>
    <div class="node-body">
      ${kids.length ? `<div class="node-kids" role="group">${kids.map(k=>renderNode(k,cm,matchIds,lvl+1)).join('')}</div>` : ''}
    </div>
  </div>`;
}
function renderProjSel(){
  const sel = document.getElementById('projSel');
  sel.innerHTML = state.projects.map(p=>`<option value="${esc(p.id)}"${p.id===state.currentId?' selected':''}>${esc(p.name||t('unnamed'))}</option>`).join('');
}
function renderTmplChip(){
  const p = curProj();
  const chip = document.getElementById('tmplChip');
  if(!chip) return;
  const tmpl = p && p.template;
  if(tmpl && tmpl !== 'default'){
    chip.textContent = t('tmpl_'+tmpl);
    chip.style.display = '';
  } else {
    chip.style.display = 'none';
  }
}
function render(){
  renderProjSel();
  renderTmplChip();
  const tree = document.getElementById('tree');
  const nodes = curNodes();
  if(!ui.collapseInit) initCollapse();
  const cm = childrenMap(nodes);
  const roots = cm['__root__']||[];
  const matchIds = ui.searchQ ? buildMatchSet(nodes, ui.searchQ) : null;
  if(!nodes.length){
    tree.innerHTML = `<div class="emptytip">${esc(t('empty_proj'))}<div class="em-add"><button class="tb-btn primary" data-act="addroot">${esc(t('add_root'))}</button></div></div>`;
  } else {
    tree.innerHTML = roots.map(n=>renderNode(n,cm,matchIds,1)).join('') + `<div class="add-root"><button class="tb-btn" data-act="addroot">${esc(t('add_root'))}</button></div>`;
  }
  /* 更新搜索计数 */
  if(matchIds !== null){
    const cnt = matchIds.size; // 包括祖先，视觉上就是显示的节点数
    document.getElementById('searchCount').textContent = cnt ? cnt+' '+t('stats_nodes') : t('no_results')||'无结果';
  } else {
    document.getElementById('searchCount').textContent = '';
  }
  renderStats(nodes, matchIds);
  ensureTreeTabindex(); // a11y: 保证树内恒有一个 treeitem 可 Tab 进入
}

/* ---------------- a11y: 键盘树导航 (WAI-ARIA tree 模式) ---------------- */
/* 当前展开状态下，从上到下可见的节点 id 有序序列（不依赖 DOM/CSS，纯数据模型计算） */
function visibleNodeSeq(){
  const nodes = curNodes();
  const cm = childrenMap(nodes);
  const matchIds = ui.searchQ ? buildMatchSet(nodes, ui.searchQ) : null;
  const seq = [];
  (function walk(list){
    list.forEach(n=>{
      if(matchIds && !matchIds.has(n.id)) return;
      seq.push(n.id);
      const kids = cm[n.id]||[];
      const collapsed = matchIds ? false : ui.collapsed.has(n.id);
      if(kids.length && !collapsed) walk(kids);
    });
  })(cm['__root__']||[]);
  return seq;
}
/* roving tabindex：焦点节点 tabindex=0，其余 -1；无有效焦点时给第一个可见节点，保证 Tab 能进树 */
function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(String(s)):String(s); }
/* roving tabindex：焦点 treeitem 及其行内控件设 0，其余全部 -1 (控件随节点焦点进入 Tab 序列) */
function setRovingTab(el){
  document.querySelectorAll('#tree [role="treeitem"]').forEach(n=>{ n.tabIndex = -1; });
  document.querySelectorAll('#tree .node-ctrl').forEach(c=>{ c.tabIndex = -1; });
  if(el){
    el.tabIndex = 0;
    const head = el.querySelector(':scope > .node-head');
    if(head) head.querySelectorAll('.node-ctrl').forEach(c=>{ c.tabIndex = 0; });
  }
}
function ensureTreeTabindex(){
  const items = document.querySelectorAll('#tree [role="treeitem"]');
  if(!items.length) return;
  const target = ui.focusId ? document.querySelector('#tree .node[data-node="'+cssEsc(ui.focusId)+'"]') : null;
  setRovingTab(target || items[0]);
}
/* 把键盘焦点移到指定节点；目标不存在(被删/被搜索过滤)则回退到首个可见节点，避免焦点丢失(键盘陷阱) */
function focusNode(id){
  let el = id ? document.querySelector('#tree .node[data-node="'+cssEsc(id)+'"]') : null;
  if(!el){
    const seq = visibleNodeSeq();
    id = seq[0] || null;
    el = id ? document.querySelector('#tree .node[data-node="'+cssEsc(id)+'"]') : null;
  }
  if(el){ ui.focusId = id; setRovingTab(el); el.focus(); }
}
/* 树内方向键导航 */
function treeKeydown(e){
  /* 焦点在行内控件按钮上：Enter/Space 触发该控件，不走树导航 */
  const ctrl = e.target.closest && e.target.closest('.node-ctrl');
  if(ctrl){
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      const a=ctrl.dataset.act, id=ctrl.dataset.id;
      if(a==='edit'){ const n=curNodes().find(x=>x.id===id); if(n) openNodeModal('edit', n); }
      else if(a==='addchild'){ openNodeModal('add', null, id); }
      else if(a==='del'){ delNode(id); }
    }
    return;
  }
  const item = e.target.closest && e.target.closest('[role="treeitem"]');
  if(!item) return;
  const cur = item.dataset.node;
  if(!cur) return;
  const nodes = curNodes();
  const cm = childrenMap(nodes);
  const node = nodes.find(n=>n.id===cur);
  const kids = cm[cur]||[];
  if(e.key==='ArrowDown'){
    e.preventDefault(); const seq=visibleNodeSeq(); const i=seq.indexOf(cur);
    if(i>-1 && i<seq.length-1) focusNode(seq[i+1]);
  } else if(e.key==='ArrowUp'){
    e.preventDefault(); const seq=visibleNodeSeq(); const i=seq.indexOf(cur);
    if(i>0) focusNode(seq[i-1]);
  } else if(e.key==='ArrowRight'){
    e.preventDefault();
    if(kids.length){
      if(ui.collapsed.has(cur)){ ui.collapsed.delete(cur); render(); focusNode(cur); }
      else {
        /* 已展开：仅当下一个可见节点确实是本节点的子时才进入(搜索模式下子可能被过滤掉) */
        const seq=visibleNodeSeq(); const i=seq.indexOf(cur);
        if(i>-1 && i<seq.length-1){ const nx=nodes.find(n=>n.id===seq[i+1]); if(nx && nx.parent_id===cur) focusNode(seq[i+1]); }
      }
    }
  } else if(e.key==='ArrowLeft'){
    e.preventDefault();
    if(kids.length && !ui.collapsed.has(cur)){ ui.collapsed.add(cur); render(); focusNode(cur); }
    else if(node && node.parent_id){ focusNode(node.parent_id); }
  } else if(e.key==='Enter'){
    e.preventDefault(); if(node) openNodeModal('edit', node);
  } else if(e.key==='Delete' || e.key==='Backspace'){
    e.preventDefault();
    const seq=visibleNodeSeq(); const i=seq.indexOf(cur);
    const fallback = (node && node.parent_id) || (i>0?seq[i-1]:(seq[i+1]||null));
    delNode(cur); // 内含 confirm；取消则节点仍在
    focusNode(curNodes().find(n=>n.id===cur) ? cur : fallback);
  } else if(e.key==='Home'){
    e.preventDefault(); const seq=visibleNodeSeq(); if(seq.length) focusNode(seq[0]);
  } else if(e.key==='End'){
    e.preventDefault(); const seq=visibleNodeSeq(); if(seq.length) focusNode(seq[seq.length-1]);
  }
}

/* 底部统计条渲染 */
function renderStats(nodes, matchIds){
  const bar = document.getElementById('statsBar');
  if(!bar) return;
  const src = nodes || curNodes();
  if(!src.length){ bar.classList.remove('vis'); return; }
  /* 搜索时只统计命中节点（不含纯祖先），其他时候统计全部 */
  const visible = matchIds
    ? src.filter(n=> matchIds.has(n.id) && (
        (n.name||'').toLowerCase().includes(ui.searchQ.toLowerCase()) ||
        (n.director||'').toLowerCase().includes(ui.searchQ.toLowerCase()) ||
        (n.subtitle||'').toLowerCase().includes(ui.searchQ.toLowerCase())
      ))
    : src;
  const total   = visible.length;
  const have    = visible.filter(n=>(n.meta||{}).badge==='have').length;
  const partial = visible.filter(n=>(n.meta||{}).badge==='partial').length;
  const gap     = visible.filter(n=>(n.meta||{}).badge==='gap').length;
  const pre = t('stats_total'); // "共"/"計"/""
  const suf = t('stats_nodes'); // "个节点"/"件"/"nodes"
  const totalLabel = [pre, total, suf].filter(Boolean).join(' ');
  let html = `<span class="stats-item"><span class="stats-dot dot-gray"></span>${totalLabel}</span>`;
  if(have)    html += `<span class="stats-sep">·</span><span class="stats-item"><span class="stats-dot dot-green"></span>${have} ${esc(tpl('b_have'))}</span>`;
  if(partial) html += `<span class="stats-sep">·</span><span class="stats-item"><span class="stats-dot dot-orange"></span>${partial} ${esc(tpl('b_partial'))}</span>`;
  if(gap)     html += `<span class="stats-sep">·</span><span class="stats-item"><span class="stats-dot dot-red"></span>${gap} ${esc(tpl('b_gap'))}</span>`;
  bar.innerHTML = html;
  bar.classList.add('vis');
}

/* ---------------- 撤销 / 重做 ----------------
   全状态快照栈：每次数据 mutation 前 pushUndo() 抓一张快照。
   快照 = JSON.stringify({projects, currentId})，栈深上限 60。 */
const histState = { undo:[], redo:[], LIMIT:60 };
function snapshotState(){ return JSON.stringify({ projects: state.projects, currentId: state.currentId }); }
function pushUndo(){
  histState.undo.push(snapshotState());
  if(histState.undo.length > histState.LIMIT) histState.undo.shift();
  histState.redo.length = 0;   // 新操作清空 redo 分支
  updateUndoButtons();
}
function applySnapshot(snap){
  const d = JSON.parse(snap);
  state.projects = d.projects;
  if(d.currentId && state.projects.find(p=>p.id===d.currentId)) state.currentId = d.currentId;
  else if(!state.projects.find(p=>p.id===state.currentId)) state.currentId = state.projects[0] ? state.projects[0].id : null;
  ui.collapseInit = false;     // 树结构可能变，重算折叠
  saveToStorage();
  render();
}
function undoAction(){
  if(!histState.undo.length){ toast(t('undo_empty')); return; }
  histState.redo.push(snapshotState());
  applySnapshot(histState.undo.pop());
  updateUndoButtons();
  toast(t('undo_done'));
}
function redoAction(){
  if(!histState.redo.length){ toast(t('redo_empty')); return; }
  histState.undo.push(snapshotState());
  applySnapshot(histState.redo.pop());
  updateUndoButtons();
  toast(t('redo_done'));
}
function updateUndoButtons(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if(u){ u.disabled = !histState.undo.length; u.title = t('undo_title'); }
  if(r){ r.disabled = !histState.redo.length; r.title = t('redo_title'); }
}

function closeNodeModal(){ document.getElementById('nodeModal').classList.remove('open'); nodeModalState=null; }
function saveNodeModal(){
  const st = nodeModalState; if(!st) return;
  const name = document.getElementById('fName').value.trim();
  if(!name){ document.getElementById('fName').focus(); return; }
  const director = document.getElementById('fDir').value.trim() || null;
  const subtitle = document.getElementById('fSub').value.trim() || null;
  const people   = document.getElementById('fPpl').value.trim();
  const badge    = document.getElementById('fBadge').value || null;
  const notes    = document.getElementById('fNotes').value.trim() || null; /* v0.2 */
  const proj = curProj(); if(!proj){ closeNodeModal(); return; }
  pushUndo();
  if(st.mode==='add'){
    const siblings = proj.nodes.filter(n=>(n.parent_id||null)===(st.parentId||null));
    const meta = {};
    if(people) meta.people = people;
    if(badge)  meta.badge  = badge;
    if(notes)  meta.notes  = notes;
    const row = { id:uuid(), parent_id:st.parentId||null, name, director, subtitle, sort_order:siblings.length, meta, created_at:now(), updated_at:now() };
    proj.nodes.push(row);
    proj.updated_at = now();
    if(st.parentId) ui.collapsed.delete(st.parentId);
  } else {
    const node = proj.nodes.find(n=>n.id===st.id); if(node){
      node.name = name; node.director = director; node.subtitle = subtitle;
      node.meta = Object.assign({}, node.meta||{});
      if(people) node.meta.people = people; else delete node.meta.people;
      if(badge)  node.meta.badge  = badge;  else delete node.meta.badge;
      if(notes)  node.meta.notes  = notes;  else delete node.meta.notes;
      node.updated_at = now();
      proj.updated_at = now();
    }
  }
  saveToStorage();
  closeNodeModal();
  render();
}
function delNode(id){
  const proj = curProj(); if(!proj) return;
  const node = proj.nodes.find(n=>n.id===id);
  if(!node) return;
  if(!confirm(t('del_node_confirm',{name:node.name||t('unnamed')}))) return;
  pushUndo();
  const ids = subtreeIds(proj.nodes, id);
  proj.nodes = proj.nodes.filter(n=>!ids.includes(n.id));
  proj.updated_at = now();
  saveToStorage();
  render();
}

function delProject(){

  }

  saveToStorage();
  render();

function importJsonText(text){
  let d;
  try{ d = JSON.parse(text); }catch(_){ toast(t('import_failed')); return; }
  if(!d || d.format!=='projtree' || !Array.isArray(d.projects)){ toast(t('import_failed')); return; }
  pushUndo();
  const map = {};
  state.projects.forEach(p=>{ map[p.id]=p; });
  d.projects.forEach(p=>{ if(p && p.id){ map[p.id] = p; } });
  state.projects = Object.values(map);
  if(d.projects.length) state.currentId = d.projects[0].id;
  ui.collapseInit = false;
  saveToStorage();
  render();
  toast(t('import_done',{n:d.projects.length}));
}

/* ── 懒加载 Supabase SDK (只在用户触发登录时才从 CDN 加载) ── */
function loadSupabaseSdk(){
  return new Promise((resolve, reject)=>{
    if(window.supabase){ resolve(window.supabase); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = ()=> resolve(window.supabase);
    s.onerror = ()=> reject(new Error('Failed to load Supabase SDK'));
    document.head.appendChild(s);
  });
}

/* ── 页面加载时初始化云端 ── */
async function cloudInit(){
  if(!cloudEnabled()) return;

    const supabase = await loadSupabaseSdk();
    cloud.sb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    // 监听 auth 状态变化
    cloud.sb.auth.onAuthStateChange((event, session)=>{
      if(event==='SIGNED_IN' && session && (!cloud.session || cloud.session.user.id !== session.user.id)){
        onCloudSignIn(session);
      } else if(event==='SIGNED_OUT'){
        onCloudSignOut();

    const { data:{ session } } = await cloud.sb.auth.getSession();

      if(inviteToken){ openAuthModal(inviteToken); }

function onCloudSignOut(){
  cloud.session = null;
  cloud.workspaceId = null;
  cloud.members = [];
  if(cloud.channel && cloud.sb){ cloud.sb.removeChannel(cloud.channel); cloud.channel = null; }
  renderCloudUI();
  renderSyncIndicator('idle');
}

/* ── 确保个人工作区存在 ── */
async function ensureWorkspace(){
  const uid = cloud.session.user.id;
  const { data: memberships, error } = await cloud.sb.from('workspace_members')
    .select('workspace_id, role')
    .eq('user_id', uid)
    .order('joined_at', { ascending: true })
    .limit(1);
  if(error) throw error;
  if(memberships && memberships.length){
    cloud.workspaceId = memberships[0].workspace_id;
  } else {
    // 触发器没跑到时手动建工作区
    const meta = cloud.session.user.user_metadata || {};
    const displayName = meta.full_name || meta.name || cloud.session.user.email?.split('@')[0] || '我';
    const { data: ws, error: wsErr } = await cloud.sb.from('workspaces')
      .insert({ name: displayName + ' 的工作区', owner_id: uid })
      .select().single();
    if(wsErr) throw wsErr;
    cloud.workspaceId = ws.id;
    await cloud.sb.from('workspace_members').insert({ workspace_id: ws.id, user_id: uid, role: 'owner' });
  }
  const { data: members } = await cloud.sb.from('workspace_members')
    .select('user_id, role, joined_at').eq('workspace_id', cloud.workspaceId);
  cloud.members = members || [];
}

/* ── 从云端拉取全量数据覆盖本地 state ── */
async function pullFromCloud(){
  if(!cloud.sb || !cloud.workspaceId) return;
  try{
    const { data: projects, error: pErr } = await cloud.sb.from('projects')
      .select('id, name, template, sort_order, created_at, updated_at')
      .eq('workspace_id', cloud.workspaceId)
      .order('sort_order');
    if(pErr) throw pErr;
    if(!projects || !projects.length){
      // 云端空 → 首次登录, 迁移本地数据
      await migrateIfNeeded();
      return;
    }
    const { data: nodes, error: nErr } = await cloud.sb.from('nodes')
      .select('id, project_id, parent_id, name, director, subtitle, sort_order, meta, created_at, updated_at')
      .in('project_id', projects.map(p=>p.id))
      .order('sort_order');
    if(nErr) throw nErr;
    // 按项目分组节点
    const byProj = {};
    (nodes||[]).forEach(n=>{
      if(!byProj[n.project_id]) byProj[n.project_id] = [];
      byProj[n.project_id].push({
        id: n.id, parent_id: n.parent_id||null,
        name: n.name||'', director: n.director||null,
        subtitle: n.subtitle||null, sort_order: n.sort_order||0,
        meta: n.meta||{}, created_at: n.created_at, updated_at: n.updated_at,
      });
    });
    state.projects = projects.map(p=>({
      id: p.id, workspace_id: cloud.workspaceId,
      name: p.name, template: p.template||'default',
      sort_order: p.sort_order||0,
      created_at: p.created_at, updated_at: p.updated_at,
      nodes: byProj[p.id] || [],
    }));
    if(!state.currentId || !state.projects.find(p=>p.id===state.currentId)){
      state.currentId = state.projects[0]?.id || null;
    }
    // 远程改动已覆盖本地 → 旧撤销快照失效, 清空(否则撤销会回退掉协作者刚写入的改动)
    histState.undo.length = 0; histState.redo.length = 0; updateUndoButtons();
    saveToLocalOnly();
    render();
  } catch(e){
    console.error('[cloud] pull error:', e);
    renderSyncIndicator('error');
  }
}

/* ── 首次登录: 把已有本地数据迁移到云端 ── */
async function migrateIfNeeded(){
  if(!cloud.sb || !cloud.workspaceId || !state.projects.length) return;
  state.projects.forEach(p=>{ p.workspace_id = cloud.workspaceId; });
  await pushToCloud();
  toast(t('migrated_toast'));
}

/* ── 把本地 state 全量推送到 Supabase ── */
async function pushToCloud(){
  if(!cloud.sb || !cloud.workspaceId || !cloud.session) return;
  renderSyncIndicator('syncing');
  try{
    const uid = cloud.session.user.id;
    const ts = now();
    // Upsert 项目
    const projRows = state.projects.map((p,i)=>({
      id: p.id, workspace_id: cloud.workspaceId,
      name: p.name, template: p.template||'default',
      sort_order: i, updated_at: ts,
    }));
    const { error: pErr } = await cloud.sb.from('projects').upsert(projRows, { onConflict:'id' });
    if(pErr) throw pErr;
    // Upsert 节点
    const nodeRows = state.projects.flatMap(p=>
      p.nodes.map((n,i)=>({
        id: n.id, project_id: p.id, parent_id: n.parent_id||null,
        name: n.name||'', director: n.director||null,
        subtitle: n.subtitle||null, sort_order: i,
        meta: n.meta||{}, updated_at: ts, updated_by: uid,
      }))
    );
    if(nodeRows.length){
      // 分块 upsert：每批 200 行，防止大工作区单请求超限
      const CHUNK = 200;
      for(let i = 0; i < nodeRows.length; i += CHUNK){
        const { error: nErr } = await cloud.sb.from('nodes')
          .upsert(nodeRows.slice(i, i + CHUNK), { onConflict:'id' });
        if(nErr) throw nErr;
      }
    }
    renderSyncIndicator('synced');
  } catch(e){
    console.error('[cloud] push error:', e);
    renderSyncIndicator('error');
  }
}

/* ── 防抖推送 (saveToStorage 调用) ── */
function schedulePush(){
  if(!cloudEnabled() || !cloud.session) return;
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(()=> pushToCloud(), 800);
}

/* ── Realtime 订阅: 有协作者改动时拉最新 ── */
async function setupRealtime(){
  if(!cloud.sb || !cloud.workspaceId) return;
  if(cloud.channel){ cloud.sb.removeChannel(cloud.channel); cloud.channel = null; }
  const onRemoteChange = ()=>{
    clearTimeout(cloud._rtTimer);
    cloud._rtTimer = setTimeout(()=> pullFromCloud(), 300);
  };
  cloud.channel = cloud.sb.channel('ws-' + cloud.workspaceId)
    .on('postgres_changes', { event:'*', schema:'public', table:'nodes' }, onRemoteChange)
    .on('postgres_changes', { event:'*', schema:'public', table:'projects' }, onRemoteChange)
    .subscribe();
}

/* ── 生成邀请链接 ── */
async function createInvite(){
  if(!cloud.sb || !cloud.workspaceId) return;
  const inp = document.getElementById('inviteLinkInput');
  inp.value = t('syncing');
  try{
    const { data, error } = await cloud.sb.from('invite_tokens')
      .insert({ workspace_id: cloud.workspaceId, created_by: cloud.session.user.id })
      .select().single();
    if(error) throw error;
    const base = location.href.split('?')[0].split('#')[0];
    inp.value = base + '?invite=' + data.token;
  } catch(e){
    console.error('[cloud] createInvite error:', e);
    inp.value = '';
    toast(t('sync_error'));
  }
}

/* ── 用邀请 token 加入工作区 ── */
async function redeemInvite(token){
  if(!cloud.sb || !cloud.session) return;
  try{
    const { data: tk, error: tkErr } = await cloud.sb.from('invite_tokens')
      .select('workspace_id, role, used_by, expires_at')
      .eq('token', token).single();
    if(tkErr || !tk){ toast(t('invite_invalid')); return; }
    if(tk.used_by){ toast(t('invite_used')); return; }
    if(new Date(tk.expires_at) < new Date()){ toast(t('invite_expired')); return; }
    await cloud.sb.from('invite_tokens')
      .update({ used_by: cloud.session.user.id, used_at: now() }).eq('token', token);
    await cloud.sb.from('workspace_members').upsert({
      workspace_id: tk.workspace_id,
      user_id: cloud.session.user.id,
      role: tk.role,
    }, { onConflict: 'workspace_id,user_id' });
    cloud.workspaceId = tk.workspace_id;
    toast(t('invite_joined'));
    // 清除 URL 中的 invite 参数
    const url = new URL(location.href);
    url.searchParams.delete('invite');
    history.replaceState(null, '', url.toString());
    await pullFromCloud();
    await setupRealtime();
  } catch(e){
    console.error('[cloud] redeemInvite error:', e);
    toast(t('invite_invalid'));
  }
}

/* ── 更新云端 UI 状态 ── */
function renderCloudUI(){
  const enabled = cloudEnabled();
  ['cloudSep','syncDot'].forEach(id=>{ document.getElementById(id).style.display = enabled ? '' : 'none'; });
  document.getElementById('inviteBtn').style.display = (enabled && cloud.session) ? '' : 'none';
  const cloudBtn = document.getElementById('cloudBtn');
  cloudBtn.style.display = enabled ? '' : 'none';
  if(!enabled) return;
  if(cloud.session){
    const meta = cloud.session.user.user_metadata || {};
    const name = meta.full_name || meta.name || cloud.session.user.email?.split('@')[0] || '我';
    const av = meta.avatar_url || '';
    cloudBtn.classList.add('signed-in');
    cloudBtn.innerHTML = av
      ? `<img src="${av}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;" alt="">`
      : `<span style="font-size:11px;font-weight:600;">${name.slice(0,2)}</span>`;
    cloudBtn.title = name + ' · ' + t('click_signout');
  } else {
    cloudBtn.classList.remove('signed-in');
    cloudBtn.textContent = t('sign_in');
    cloudBtn.title = '';
  }
}

/* ── 同步指示器 (topbar 小圆点) ── */
function renderSyncIndicator(s){
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot';
  if(s==='syncing'){ dot.classList.add('syncing'); dot.title = t('syncing'); dot.style.display=''; }
  else if(s==='synced'){ dot.classList.add('synced'); dot.title = t('synced'); dot.style.display=''; }
  else if(s==='error'){ dot.classList.add('error'); dot.title = t('sync_error'); dot.style.display=''; }
  else { dot.style.display = cloudEnabled() ? '' : 'none'; }
}

/* ── 渲染邀请弹窗成员列表 ── */
async function renderMemberList(){
  const list = document.getElementById('memberList');
  if(!list || !cloud.sb || !cloud.workspaceId) return;
  const { data } = await cloud.sb.from('workspace_members')
    .select('user_id, role, joined_at').eq('workspace_id', cloud.workspaceId);
  cloud.members = data || [];
  const myId = cloud.session?.user.id;
  list.innerHTML = cloud.members.map(m=>{
    const isMe = m.user_id === myId;
    const meta = isMe ? (cloud.session.user.user_metadata||{}) : {};
    const name = isMe
      ? (meta.full_name || meta.name || cloud.session.user.email?.split('@')[0] || 'me')
      : m.user_id.slice(0,8)+'…';
    const av = isMe ? (meta.avatar_url||'') : '';
    return `<div class="member-row">
      <div class="member-avatar">${av ? `<img src="${av}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">` : name.slice(0,1).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="member-name" style="font-size:13px;font-weight:500;color:var(--text)">${name}${isMe?' ('+t('by')+'me)':''}</div>
        <div class="member-role" style="font-size:11px;color:var(--muted)">${m.role}</div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('tree').addEventListener('click', e=>{
  const act = e.target.closest('[data-act]');
  if(act){
    e.preventDefault(); e.stopPropagation();
    const a = act.dataset.act, id = act.dataset.id;
    if(a==='edit'){ const p=curProj(); const n=p&&p.nodes.find(x=>x.id===id); if(n) openNodeModal('edit',n); }
    else if(a==='addchild'){ openNodeModal('add', null, id); }
    else if(a==='addroot'){ openNodeModal('add', null, null); }
    else if(a==='del'){ delNode(id); }
    return;
  }
  const nh = e.target.closest('[data-nodehead]');
  if(nh){
    const id = nh.dataset.nodehead;
    ui.focusId = id; // a11y: 点击的节点成为键盘焦点锚点
    ui.collapsed.has(id) ? ui.collapsed.delete(id) : ui.collapsed.add(id);
    render();
  }
});

  document.getElementById('searchBar').classList.add('open');
  document.getElementById('searchInput').focus();
  document.getElementById('searchInput').select();

function closeSearch(){
  document.getElementById('searchBar').classList.remove('open');
  ui.searchQ = '';

  render();
}
function openShortcutsModal(){ document.getElementById('shortcutsModal').classList.add('open'); }
function closeShortcutsModal(){ document.getElementById('shortcutsModal').classList.remove('open'); }

document.addEventListener('keydown', e=>{
  /* Esc：关弹窗 > 关搜索 */
  if(e.key==='Escape'){
    if(document.querySelector('.modal.open')){ closeNodeModal(); closeProjModal(); closeAuthModal(); closeInviteModal(); closeShortcutsModal(); return; }
    if(document.getElementById('searchBar').classList.contains('open')){ closeSearch(); return; }
    return;
  }
  /* 如果焦点在输入框里，不触发快捷键 */
  const tag = document.activeElement && document.activeElement.tagName;
  const inInput = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(inInput) return;
  /* 如果有弹窗打开，不触发快捷键 */
  if(document.querySelector('.modal.open')) return;
  /* 撤销/重做：⌘Z 撤销，⌘⇧Z 或 Ctrl+Y 重做 */
  if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey)&&!e.shiftKey){ e.preventDefault(); undoAction(); return; }
  if((((e.key==='z'||e.key==='Z')&&e.shiftKey)||(e.key==='y'||e.key==='Y'))&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); redoAction(); return; }
  if(e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey))){ e.preventDefault(); openSearch(); return; }
  if(e.key==='?'){ openShortcutsModal(); return; }
  if(e.key==='n'||e.key==='N'){ openNodeModal('add',null,null); return; }
  if(e.key==='e'||e.key==='E'){ ui.collapsed.clear(); render(); return; }
  if(e.key==='c'||e.key==='C'){
    const cm = childrenMap(curNodes());
    ui.collapsed = new Set(curNodes().filter(n=>(cm[n.id]||[]).length).map(n=>n.id));
    render(); return;
  }
});
